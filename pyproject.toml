[project]
name = "curso-agentes-ia"
version = "0.1.0"
description = "AI agents for banking and regulation: tool calling, LangChain/LangGraph and RAG"
authors = [
    { name = "Alberto Torres", email = "albertotb@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LLM providers
    "openai>=2",
    # Agent frameworks
    "langchain>=1.5,<2",
    "langchain-openai>=1.8",
    "langchain-google-genai>=4.5",
    "langgraph>=1.2,<2",
    # Notebook
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    # Utilities
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports next to the cell that introduces them
"*.ipynb" = ["E402"]
