[project]
name = "curso-agentes-ia"
version = "0.1.0"
description = "AI agents for banking and regulation: tool calling, LangChain/LangGraph and RAG"
authors = [
    { name = "Alberto Torres", email = "albertotb@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LLM providers
    "openai>=2",
    # Agent frameworks
    "langchain>=1.5,<2",
    "langchain-openai>=1.8",
    "langchain-google-genai>=4.5",
    "langgraph>=1.2,<2",
    # RAG
    "numpy>=1.26",
    "pandas>=2.2",
    "rank-bm25>=0.2.2",
    # Utilities
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "nbstripout>=0.9.1",
    "ruff>=0.4",
]

[build-system]
requires = ["uv_build>=0.5.15"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
# The distribution is `curso-agentes-ia`; the importable module is `cai`.
module-name = "cai"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports next to the cell that introduces them; exercises redefined by their solutions
"*.ipynb" = ["E402", "F811"]
