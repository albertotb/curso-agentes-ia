name: Publish slides

# Renders the Quarto slides and the index page (index.qmd) and publishes them to GitHub Pages.
# The rendered HTML is never committed: it travels as a Pages artifact.

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - "_quarto.yml"
      - "index.qmd"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Render slides
        run: quarto render --output-dir _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
